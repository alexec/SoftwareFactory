name: SoftwareFactory
options:
  bundleIdPrefix: com.alexecollins
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
# Three configurations, not two: the Mac app ships twice, once for the store and once
# for direct download. See the note on the Release-AppStore settings below.
configs:
  Debug: debug
  Release: release
  Release-AppStore: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 6T4RVD5724
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
  # This xcodegen install has no bundled setting presets, so the per-configuration
  # settings are spelled out. DEBUG gates the Developer section of Settings; release
  # builds must not define it.
  #
  # Release builds the Mac app for direct download: not sandboxed, so it can start an
  # agent in your own environment. Release-AppStore builds the same source sandboxed,
  # because the Mac App Store takes nothing else; there the app puts the launch command
  # on the clipboard instead. The iPhone app is the same either way and archives from
  # Release. (T163, 13 Sep 2026.)
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES
    Release-AppStore:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES
packages:
  SoftwareFactoryKit:
    path: Packages/SoftwareFactoryKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.19.0
targets:
  SoftwareFactory:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
    dependencies:
      - package: SoftwareFactoryKit
        product: SoftwareFactoryKit
      - package: SwiftTerm
        product: SwiftTerm
    # Two entitlements files, one per way the app ships, both hand-written and both
    # commented: App/SoftwareFactory.entitlements has the sandbox off for the direct
    # download, App/SoftwareFactory-AppStore.entitlements has it on for the store. They
    # are not generated from here, because xcodegen manages one file per target and
    # would write the same one into every configuration. Add an entitlement to one and
    # add it to the other. (T163, 13 Sep 2026.)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Taktu: Software Factory"
        CFBundleName: "Taktu: Software Factory"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Alex Collins
        CFBundleIconName: AppIcon
        NSMicrophoneUsageDescription: "Taktu: Software Factory listens while you dictate a task. The words are recognised on this Mac and nothing is recorded."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.softwarefactory
        PRODUCT_NAME: Software Factory
        GENERATE_INFOPLIST_FILE: NO
        # Without this the catalog's AppIcon is never compiled in (Alex, 12 Sep 2026: no icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: App/SoftwareFactory.entitlements
      configs:
        Release-AppStore:
          CODE_SIGN_ENTITLEMENTS: App/SoftwareFactory-AppStore.entitlements
  SoftwareFactoryPhone:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Phone/Sources
      - path: Phone/Resources
      - path: Phone/Activity
      - path: Shared
    entitlements:
      path: Phone/SoftwareFactoryPhone.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.alexecollins.softwarefactory
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    dependencies:
      - package: SoftwareFactoryKit
        product: SoftwareFactoryKit
      - target: SoftwareFactoryPhoneWidgets
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: "Taktu: Software Factory"
        CFBundleName: "Taktu: Software Factory"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Alex Collins
        CFBundleIconName: AppIcon
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        NSLocalNetworkUsageDescription: "Taktu: Software Factory looks for the factory running on your Mac, on the same network, so you can answer its questions from here."
        NSMicrophoneUsageDescription: "Taktu: Software Factory listens while you dictate a task. The words are recognised on this phone and nothing is recorded."
        NSBonjourServices: [_softwarefactory._tcp]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.softwarefactory
        PRODUCT_NAME: Software Factory
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
  SoftwareFactoryPhoneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Phone/Widgets
      - path: Phone/Activity
    info:
      path: Phone/Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Taktu: Software Factory"
        CFBundleName: "Taktu: Software Factory Widgets"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSHumanReadableCopyright: © 2026 Alex Collins
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexecollins.softwarefactory.widgets
        PRODUCT_NAME: SoftwareFactoryWidgets
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
schemes:
  SoftwareFactoryPhone:
    build:
      targets:
        SoftwareFactoryPhone: all
    run:
      config: Debug
  SoftwareFactory:
    build:
      targets:
        SoftwareFactory: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SoftwareFactoryKit/SoftwareFactoryKitTests
