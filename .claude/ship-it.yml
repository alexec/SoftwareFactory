app: SoftwareFactory
scheme: SoftwareFactory                 # the Mac app; SoftwareFactoryPhone is the iPhone
bundle_id: com.alexecollins.softwarefactory
platforms: [macos, ios]                 # one bundle id, two targets, no iPad

# On this Mac and on Alex's iPhone for him to try. No reviews have run: it is a proof of
# concept he is already using to track its own work.
phase: devtest            # dev | devtest | test | review | live — see the sdlc skill; only Alex moves it
phase_history:
  - dev 2026-09-12          # scaffolded as Foreman: dashboard, store, Claude Code scan
  - devtest 2026-09-12      # renamed Software Factory; MCP on port 4747; iPhone remote on his phone
tier: 5
focus: >
  He is using it: the Mac floor, the MCP server registered with Claude Code, the iPhone
  remote on Wi‑Fi. Next in the factory's own backlog: CloudKit so the phone works away
  from home, then resources and capacity. (Alex, 2026-09-12)

stages: [survey, land, tidy-repo, test, devices, tidy-build, report, archive-upload, testflight]
# OPENED 12 Sep 2026: Alex asked directly to get the app into TestFlight so he can test
# and install it there instead of a manual devicectl install. This is TestFlight for
# Alex himself as internal tester, not a release to anyone else - do not add external
# testers or submit for external-testing review without asking him again.

git:
  repo: true
  remote: none
  workflow: main-only
  branch_prefix: claude/

devices:
  mac: this Mac
  iphone: his iPhone 15 Pro Max                 # `xcrun devicectl list devices`; the id stays out of the repo
keep_installed: true                              # he is using it; never uninstall

archive:
  ios:
    scheme: SoftwareFactoryPhone
    export_plist: AppStore/ExportOptions-iOS.plist          # destination export; -upload.plist uploads
    path: build/SoftwareFactoryPhone.xcarchive
  macos:
    scheme: SoftwareFactory
    export_plist: AppStore/ExportOptions-macOS.plist
    path: build/SoftwareFactory.xcarchive
  build_number_key: CURRENT_PROJECT_VERSION                 # in project.yml; build 2 uploaded 13 Sep 2026, iOS only
  macos_configs: >
    The Mac app ships twice from one set of sources (T163, 13 Sep 2026). Release is the
    direct download: not sandboxed, so it can start an agent in Alex's own environment,
    Developer ID signed and notarised, exported with ExportOptions-macOS-direct.plist.
    Release-AppStore is the store build: the same sources sandboxed, which is the only
    kind the Mac App Store takes, exported with ExportOptions-macOS.plist or
    -macOS-upload.plist. Sandboxed the app cannot launch an agent and does not pretend
    to: it puts the command on the clipboard. ARCHIVE the Mac app with
    -configuration Release-AppStore for anything going to Apple. Build 2 was iPhone only;
    no macOS build has gone up since the sandbox came off.
asc_api_key: ~/.private_keys/asc.env                       # proved 12 Sep 2026: doctor, builds, testers all answer
store:
  record: "Taktu: Software Factory"                         # created 12 Sep 2026, iOS + macOS
  groups: Internal Testers (internal, automatic distribution) - Alex only. Automatic
    distribution means a VALID build reaches him with no assignment step. Do not add
    external testers or submit for external-testing review without asking him again.
