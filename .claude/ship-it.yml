app: SoftwareFactory
scheme: SoftwareFactory                 # the Mac app; SoftwareFactoryPhone is the iPhone
bundle_id: com.alexecollins.softwarefactory
platforms: [macos, ios]                 # one bundle id, two targets, no iPad

# On this Mac and on Alex's iPhone for him to try. No reviews have run: it is a proof of
# concept he is already using to track its own work.
phase: devtest            # dev | devtest | test | review | live — see the sdlc skill; only Alex moves it
phase_history:
  - dev 2026-09-12          # scaffolded as Foreman: dashboard, store, Claude Code scan
  - devtest 2026-09-12      # renamed Software Factory; MCP on port 4747; iPhone remote on his phone
tier: 5
focus: >
  He is using it: the Mac floor, the MCP server registered with Claude Code, the iPhone
  remote on Wi‑Fi. Next in the factory's own backlog: CloudKit so the phone works away
  from home, then resources and capacity. (Alex, 2026-09-12)

stages: [survey, land, tidy-repo, test, devices, tidy-build, report, archive-upload, testflight]
# OPENED 12 Sep 2026: Alex asked directly to get the app into TestFlight so he can test
# and install it there instead of a manual devicectl install. This is TestFlight for
# Alex himself as internal tester, not a release to anyone else - do not add external
# testers or submit for external-testing review without asking him again.

git:
  repo: true
  remote: none
  workflow: main-only
  branch_prefix: claude/

devices:
  mac: this Mac
  iphone: his iPhone 15 Pro Max                 # `xcrun devicectl list devices`; the id stays out of the repo
keep_installed: true                              # he is using it; never uninstall
